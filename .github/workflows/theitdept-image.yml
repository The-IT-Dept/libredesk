# The IT Dept fork: every push to main builds the image and pushes it to
# ghcr.io/the-it-dept/libredesk as :main-<short sha> (pin this one) and :main. Our changes sit on
# top of upstream main; to update, rebase main onto upstream/main and push. The binary reports
# the last upstream v* tag as its version, so Libredesk's upgrade migrations behave as upstream.
name: theitdept-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g pnpm@9.15.3
      - id: v
        run: |
          echo "image=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git describe --tags --abbrev=0 --match 'v*')" >> "$GITHUB_OUTPUT"
      - run: make build
        env:
          LIBREDESK_VERSION: ${{ steps.v.outputs.upstream }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.theitdept
          push: true
          tags: |
            ghcr.io/the-it-dept/libredesk:${{ steps.v.outputs.image }}
            ghcr.io/the-it-dept/libredesk:main
          labels: |
            org.opencontainers.image.source=https://github.com/The-IT-Dept/libredesk
            org.opencontainers.image.version=${{ steps.v.outputs.image }}
